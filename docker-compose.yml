# Local development: API + Postgres + DynamoDB Local. `docker compose up --build`
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: cuentas
      POSTGRES_PASSWORD: cuentas
      POSTGRES_DB: cuentas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuentas"]
      interval: 2s
      retries: 30

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  dynamodb-init:
    image: amazon/aws-cli:latest
    depends_on:
      - dynamodb
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: mx-central-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws dynamodb list-tables --endpoint-url http://dynamodb:8000 >/dev/null 2>&1; do sleep 1; done
        aws dynamodb create-table --endpoint-url http://dynamodb:8000 \
          --table-name pagacontufoto-pey-events --billing-mode PAY_PER_REQUEST \
          --attribute-definitions AttributeName=eventId,AttributeType=S \
          --key-schema AttributeName=eventId,KeyType=HASH \
          >/dev/null 2>&1 || true
        aws dynamodb list-tables --endpoint-url http://dynamodb:8000

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      dynamodb-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://cuentas:cuentas@postgres:5432/cuentas
      SEED: "1"
      ADMIN_CLAVE: ${ADMIN_CLAVE:-cuentas-local}
      PEY_MODE: simulate
      PEY_EVENTS_TABLE: pagacontufoto-pey-events
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      AWS_REGION: mx-central-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      CURRENT_PERIOD: "2026-12"
      DEMO_USUARIO: ${DEMO_USUARIO:-}
      DEMO_CLAVE: ${DEMO_CLAVE:-}
      PEY_AMOUNT_OVERRIDE: ${PEY_AMOUNT_OVERRIDE:-}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
