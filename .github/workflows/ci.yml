name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cuentas
          POSTGRES_PASSWORD: cuentas
          POSTGRES_DB: cuentas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cuentas"
          --health-interval 2s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://cuentas:cuentas@localhost:5432/cuentas
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: OpenAPI document is up to date
        run: |
          cargo run --locked --quiet --bin openapi -- --quiet
          git diff --exit-code -- crates/cuentas-api/openapi.json

  docker:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
